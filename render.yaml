# Render Blueprint: free Docker web service for the API.
# Secrets are marked sync: false and must be filled in the Render dashboard.
services:
  - type: web
    name: label-lag-radar-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
        # Example: https://labelwatch.islamoahidul12.workers.dev,http://localhost:5173
      - key: CONTACT_EMAIL
        sync: false
      - key: STALE_DAYS
        value: "90"
      - key: DB_SIZE_LIMIT_MB
        value: "400"
      - key: LANGSMITH_TRACING
        value: "false"
      # Leaflet text extraction and checks call the LLM from the API.
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER_ORDER
        value: google_genai,openrouter
      - key: LLM_MODEL_JUDGE_google_genai
        value: gemini-flash-latest
      - key: LLM_MODEL_JUDGE_openrouter
        value: nvidia/nemotron-3.5-super-vl:free
      - key: LLM_RPS_google_genai
        value: "0.2"
      - key: LLM_RPS_openrouter
        value: "0.2"
